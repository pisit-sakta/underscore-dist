<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Underscore — Spotify Connected</title>
<style>
body{background:#0b0e13;color:#e8eaf0;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
.card{max-width:420px;padding:2rem}
h1{font-weight:200;letter-spacing:.3em;font-size:1.6rem}
code{display:block;background:#161b24;border:1px solid #2a3140;border-radius:10px;padding:.8rem;margin:1rem 0;word-break:break-all;font-size:.8rem;max-height:5.5rem;overflow:auto}
button{background:#6ab187;border:none;border-radius:10px;padding:.8rem 1.6rem;font-size:1rem;font-weight:700;cursor:pointer;color:#0b0e13}
p{color:#8a90a0;font-size:.9rem;line-height:1.6}
</style></head><body><div class="card">
<h1>UNDER_SCORE</h1>
<div id="content"></div>
</div><script>
var code = new URLSearchParams(location.search).get('code');
var el = document.getElementById('content');
if (code) {
  el.innerHTML = '<p>Spotify approved. Copy this code, go back to Underscore, and paste it in the Spotify section:</p><code id="c"></code><button onclick="navigator.clipboard.writeText(document.getElementById(\'c\').textContent).then(function(){document.querySelector(\'button\').textContent=\'Copied ✓\'})">Copy code</button>';
  document.getElementById('c').textContent = code;
} else {
  el.innerHTML = '<p>' + (new URLSearchParams(location.search).get('error') || 'No code in URL — start the connect flow from the Underscore app.') + '</p>';
}
</script></body></html>
